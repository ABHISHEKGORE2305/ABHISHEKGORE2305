    <rect width="100%" height="100%" fill="#0d1117"/>
    
    <style>
        text {
            font-family: monospace;
            font-size: 7px;
            fill: #c7c7c7;
            white-space: pre;
        }

        .row {
            animation: reveal 0.7s ease-out forwards;
            opacity: 0;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>


